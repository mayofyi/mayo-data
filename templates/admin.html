<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayo Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --lime: #d2ff01; --cyan: #b1ecf0; --pink: #ff6ef2; --orange: #ffab40;
  --yellow: #ffea12; --green: #b3ff9e; --red: #ff6b6b;
  --muted: #666; --surface: #080808; --surface2: #111; --surface3: #1a1a1a;
  --border: #222; --border2: #2a2a2a; --white: #f0f0f0;
  --nav-w: 216px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--surface); color:var(--white); font-family:'Barlow',sans-serif; font-size:14px; min-height:100vh; }
.bb { font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em; }
.bc { font-family:'Barlow Condensed',sans-serif; }
::-webkit-scrollbar { width:4px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }
::-webkit-scrollbar-track { background:transparent; }

/* ── LAYOUT ── */
.admin-app { display:flex; min-height:100vh; }

/* ── SIDENAV ── */
.sidenav {
  width:var(--nav-w); min-width:var(--nav-w);
  background:var(--surface2); border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  height:100vh; overflow-y:auto; position:sticky; top:0; flex-shrink:0;
}
.sidenav-logo {
  padding:20px 20px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.logo-text { font-family:'Bebas Neue'; font-size:28px; letter-spacing:0.05em; }
.logo-dot { color:var(--lime); }
.role-badge {
  font-family:'Barlow Condensed'; font-size:10px; font-weight:700;
  letter-spacing:0.1em; text-transform:uppercase; padding:3px 7px; border-radius:3px;
}
.sidenav-user {
  padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.avatar {
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Barlow Condensed'; font-weight:700; font-size:13px; flex-shrink:0;
}
.user-name { font-weight:600; font-size:13px; }
.user-org { font-size:11px; color:var(--muted); }
.nav-section { padding:10px 10px 4px; }
.nav-section-label {
  font-family:'Barlow Condensed'; font-size:10px; font-weight:700;
  letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); padding:0 8px 6px;
}
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:6px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--muted);
  transition:all 0.12s; margin-bottom:1px; border:none;
  background:transparent; width:100%; text-align:left;
}
.nav-item:hover { background:var(--surface3); color:var(--white); }
.nav-item.active { background:var(--surface3); color:var(--white); }
.nav-item.active .nav-icon { color:var(--lime); }
.nav-icon { font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.nav-badge {
  margin-left:auto; background:var(--lime); color:#000;
  font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px;
  font-family:'Barlow Condensed';
}

/* ── MAIN ── */
.main { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.topbar {
  padding:0 28px; height:56px; min-height:56px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface2);
}
.topbar-title { font-family:'Barlow Condensed'; font-size:18px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.topbar-actions { display:flex; align-items:center; gap:10px; }
.page { flex:1; overflow-y:auto; padding:24px 28px; }

/* ── BUTTONS ── */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:6px; border:none; cursor:pointer;
  font-family:'Barlow Condensed'; font-size:13px; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; transition:all 0.12s;
}
.btn-primary { background:var(--lime); color:#000; }
.btn-primary:hover { background:#bde500; }
.btn-ghost { background:transparent; border:1px solid var(--border2); color:var(--white); }
.btn-ghost:hover { background:var(--surface3); }
.btn-sm { padding:5px 11px; font-size:12px; }
.btn-danger { background:transparent; border:1px solid var(--red); color:var(--red); }
.btn-danger:hover { background:rgba(255,107,107,0.1); }

/* ── CARDS & STATS ── */
.stats-row { display:grid; gap:16px; margin-bottom:24px; }
.stat-card { background:var(--surface3); border:1px solid var(--border); border-radius:10px; padding:16px 20px; }
.stat-label { font-family:'Barlow Condensed'; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.stat-value { font-family:'Bebas Neue'; font-size:36px; line-height:1; }
.stat-sub { font-size:11px; color:var(--muted); margin-top:4px; }
.panel { background:var(--surface3); border:1px solid var(--border); border-radius:10px; padding:20px; }
.card { background:var(--surface3); border:1px solid var(--border); border-radius:10px; overflow:hidden; }

/* ── TABLE ── */
table { width:100%; border-collapse:collapse; }
thead th { font-family:'Barlow Condensed'; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody tr { border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.1s; }
tbody tr:hover { background:var(--surface3); }
tbody td { padding:12px 14px; vertical-align:middle; font-size:13px; }
tbody tr:last-child { border-bottom:none; }

/* ── BADGES ── */
.badge { display:inline-block; padding:3px 9px; border-radius:3px; font-family:'Barlow Condensed'; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
.badge-lime { background:var(--lime); color:#000; }
.badge-cyan { background:var(--cyan); color:#000; }
.badge-green { background:var(--green); color:#000; }
.badge-orange { background:var(--orange); color:#000; }
.badge-muted { background:var(--surface3); color:var(--muted); border:1px solid var(--border2); }
.badge-red { background:rgba(255,107,107,0.15); color:var(--red); border:1px solid rgba(255,107,107,0.3); }

/* Status pipeline */
.status-scoping  { background:var(--surface3); color:var(--muted); border:1px solid var(--border2); }
.status-contracted { background:rgba(177,236,240,0.15); color:var(--cyan); border:1px solid rgba(177,236,240,0.3); }
.status-active   { background:rgba(210,255,1,0.15); color:var(--lime); border:1px solid rgba(210,255,1,0.3); }
.status-wrapup   { background:rgba(255,171,64,0.15); color:var(--orange); border:1px solid rgba(255,171,64,0.3); }
.status-complete { background:rgba(179,255,158,0.15); color:var(--green); border:1px solid rgba(179,255,158,0.3); }

/* ── TABS ── */
.tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:20px; }
.tab-btn { background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); font-family:'Barlow Condensed'; font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:10px 16px 10px 0; cursor:pointer; margin-right:4px; transition:color 0.12s; }
.tab-btn:hover { color:var(--white); }
.tab-btn.active { border-bottom-color:var(--lime); color:var(--white); }

/* ── FORMS ── */
.form-grid { display:grid; gap:16px; }
.form-grid-2 { grid-template-columns:1fr 1fr; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-label { font-family:'Barlow Condensed'; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
.form-input, .form-select, .form-textarea {
  background:var(--surface2); border:1px solid var(--border2); border-radius:6px;
  padding:9px 12px; color:var(--white); font-family:'Barlow'; font-size:13px;
  outline:none; transition:border-color 0.15s; width:100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--lime); }
.form-select option { background:var(--surface2); }
.form-textarea { resize:vertical; min-height:80px; }
.form-hint { font-size:11px; color:var(--muted); }

/* ── MISC ── */
.section-label { font-family:'Barlow Condensed'; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.loading { text-align:center; padding:60px; color:var(--muted); font-family:'Barlow Condensed'; font-size:16px; letter-spacing:0.06em; text-transform:uppercase; }
.metric { font-family:'Barlow Condensed'; font-size:16px; font-weight:700; }
.metric-label { font-size:10px; color:var(--muted); font-family:'Barlow Condensed'; text-transform:uppercase; letter-spacing:0.05em; }
.tag { display:inline-block; padding:2px 6px; border-radius:3px; font-family:'Barlow Condensed'; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; border:1px solid var(--border2); color:var(--muted); }
.divider { border:none; border-top:1px solid var(--border); margin:20px 0; }

/* ── SLIDE PANEL ── */
#slide-panel {
  position:fixed; top:0; right:0; bottom:0; width:480px;
  background:var(--surface2); border-left:1px solid var(--border);
  z-index:200; overflow-y:auto; padding:28px;
  transform:translateX(100%); transition:transform 0.2s ease;
}
#slide-panel.open { transform:translateX(0); }
#panel-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199;
  display:none;
}

/* ── COMMUNITY MODAL ── */
#comm-modal { position:fixed; inset:0; z-index:300; overflow-y:auto; background:var(--surface); display:none; }
.comm-modal-inner { max-width:980px; margin:0 auto; padding-bottom:80px; }
.back-btn { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:var(--white); font-family:'Barlow Condensed'; font-size:13px; font-weight:700; letter-spacing:0.06em; padding:7px 14px; border-radius:5px; cursor:pointer; transition:background 0.15s; }
.back-btn:hover { background:rgba(255,255,255,0.18); }
.metric-card { background:var(--surface3); border:1px solid var(--border); border-radius:10px; padding:18px 16px; position:relative; }

/* ── MEDIA GRID ── */
.media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:16px; }
.media-item { background:var(--surface3); border:1px solid var(--border); border-radius:8px; overflow:hidden; position:relative; }
.media-item img { width:100%; height:100px; object-fit:cover; display:block; }
.media-item-cap { padding:6px 8px; font-size:11px; color:var(--muted); }
.media-item-del { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); border:none; color:var(--red); border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px; }

/* ── PIPELINE PILLS ── */
.pipeline-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.pipeline-pill {
  padding:6px 14px; border-radius:20px; cursor:pointer;
  font-family:'Barlow Condensed'; font-size:12px; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; border:1px solid var(--border2);
  background:transparent; color:var(--muted); transition:all 0.12s;
}
.pipeline-pill:hover { border-color:var(--border2); color:var(--white); }
.pipeline-pill.active { background:var(--surface3); color:var(--white); border-color:var(--lime); }

/* ── QUOTE SLOTS ── */
.quote-slot { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:14px; margin-bottom:12px; }

/* ── PROGRESS BAR ── */
.progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--lime); border-radius:2px; transition:width 0.3s; }
</style>
</head>
<body>

<div class="admin-app">
  <!-- Sidebar -->
  <nav class="sidenav">
    <div class="sidenav-logo">
      <div class="logo-text">mayo<span class="logo-dot">.</span></div>
      <span class="role-badge" style="background:var(--orange);color:#000">Admin</span>
    </div>
    <div class="sidenav-user">
      <div class="avatar" style="background:var(--lime);color:#000">A</div>
      <div>
        <div class="user-name">Admin Panel</div>
        <div class="user-org">mayo.fyi</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Overview</div>
      <button class="nav-item" id="nav-dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">⊞</span> Dashboard
      </button>
      <button class="nav-item" id="nav-projects" onclick="navigate('projects')">
        <span class="nav-icon">◈</span> Projects
        <span class="nav-badge" id="badge-projects" style="display:none">0</span>
      </button>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Management</div>
      <button class="nav-item" id="nav-briefs" onclick="navigate('briefs')">
        <span class="nav-icon">◻</span> Briefs
      </button>
      <button class="nav-item" id="nav-communities" onclick="navigate('communities')">
        <span class="nav-icon">◉</span> Communities
      </button>
      <button class="nav-item" id="nav-brands" onclick="navigate('brands')">
        <span class="nav-icon">◈</span> Brands
      </button>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="page" id="content">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<!-- Slide panel -->
<div id="panel-overlay" onclick="closePanel()"></div>
<div id="slide-panel" id="slide-panel"></div>

<!-- Community detail modal -->
<div id="comm-modal">
  <div class="comm-modal-inner" id="comm-modal-inner"></div>
</div>

<div id="admin-token" style="display:none">{{ admin_token }}</div>

<script>
const ADMIN_TOKEN = document.getElementById('admin-token').textContent.trim();

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  page: 'dashboard',
  projectFilter: 'all',
  projectTab: 'overview',
  selectedProject: null,
  communities: [], brands: [], briefs: [], projects: [],
};

// ── API ──────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(`${path}${sep}token=${ADMIN_TOKEN}`, {
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': ADMIN_TOKEN, ...opts.headers },
    ...opts
  });
  return res.json();
}

async function apiUpload(path, formData) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(`${path}${sep}token=${ADMIN_TOKEN}`, {
    method: 'POST',
    headers: { 'X-Admin-Token': ADMIN_TOKEN },
    body: formData
  });
  return res.json();
}

async function loadAll() {
  try {
    const [communities, brands, briefs, projects] = await Promise.all([
      api('/api/admin/communities'),
      api('/api/admin/brands'),
      api('/api/admin/briefs'),
      api('/api/admin/projects'),
    ]);
    S.communities = Array.isArray(communities) ? communities : [];
    S.brands = Array.isArray(brands) ? brands : [];
    S.briefs = Array.isArray(briefs) ? briefs : [];
    S.projects = Array.isArray(projects) ? projects : [];

    // Update active projects badge
    const active = S.projects.filter(p => p.status === 'active').length;
    const badge = document.getElementById('badge-projects');
    if (badge) { badge.textContent = active; badge.style.display = active ? '' : 'none'; }
  } catch (e) {
    console.error('Load error', e);
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
const COVER_OPTIONS = [
  { id:1, gradient:'linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 70%,#533483 100%)' },
  { id:2, gradient:'linear-gradient(135deg,#0d0d0d 0%,#1a0a00 40%,#3d1c00 70%,#c43a00 100%)' },
  { id:3, gradient:'linear-gradient(135deg,#0a1628 0%,#1b3a4b 50%,#2d6a4f 100%)' },
  { id:4, gradient:'linear-gradient(135deg,#1a0a00 0%,#3d2b1f 40%,#8a6a40 70%,#c4a060 100%)' },
  { id:5, gradient:'linear-gradient(135deg,#0d0d1a 0%,#1a1a3e 40%,#2d1b69 70%,#6b2d8b 100%)' },
  { id:6, gradient:'linear-gradient(135deg,#001a0a 0%,#003d1a 40%,#006b2d 70%,#00a844 100%)' },
];

const AVATAR_COLORS = [
  {bg:'#d2ff01',text:'#000'},{bg:'#b1ecf0',text:'#000'},{bg:'#ff6ef2',text:'#000'},
  {bg:'#ffab40',text:'#000'},{bg:'#b3ff9e',text:'#000'},{bg:'#ff6b6b',text:'#000'},
  {bg:'#a78bfa',text:'#000'},{bg:'#34d399',text:'#000'},
];

function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < (name||'').length; i++) h = (h * 31 + (name||'').charCodeAt(i)) & 0xffff;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function formatCurrency(n) {
  if (!n) return '—';
  return '$' + Number(n).toLocaleString();
}

function getER(c) {
  const media = c.instagram_data?.media || [];
  const followers = c.instagram_data?.profile?.followers_count || 0;
  if (!media.length || !followers) return null;
  const total = media.reduce((sum, p) => sum + (p.like_count||0) + (p.comments_count||0), 0);
  return Math.round(total / media.length / followers * 10000) / 100;
}

function getFollowers(c) { return c.instagram_data?.profile?.followers_count ?? null; }

function getTier(c) {
  const n = [!!c.instagram_token, !!c.substack_url].filter(Boolean).length;
  if (n >= 2) return 'fully-verified';
  if (n >= 1) return 'verified';
  return 'starter';
}

function tierBadge(tier) {
  if (tier === 'fully-verified') return '<span class="badge badge-lime">✦ Fully Verified</span>';
  if (tier === 'verified') return '<span class="badge badge-cyan">✦ Verified</span>';
  return '<span class="badge badge-muted">Starter</span>';
}

const STATUS_LABELS = {
  scoping:'Scoping', contracted:'Contracted', active:'Active', wrapup:'Wrap-up', complete:'Complete'
};

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status || '—';
  return `<span class="badge status-${status||'scoping'}">${label}</span>`;
}

// ── Navigation ───────────────────────────────────────────────────────────────
function navigate(page, extra = {}) {
  S.page = page;
  Object.assign(S, extra);
  ['dashboard','projects','briefs','communities','brands'].forEach(p => {
    const el = document.getElementById(`nav-${p}`);
    if (el) el.classList.toggle('active', page === p);
  });
  const titles = { dashboard:'Dashboard', projects:'Projects', briefs:'Briefs', communities:'Communities', brands:'Brands' };
  document.getElementById('topbar-title').textContent = titles[page] || page;
  renderTopbarActions();
  render();
}

function renderTopbarActions() {
  const el = document.getElementById('topbar-actions');
  if (S.page === 'projects' && !S.selectedProject) {
    el.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openCreateProject()">+ New Project</button>`;
  } else if (S.page === 'briefs') {
    el.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openCreateBrief()">+ New Brief</button>`;
  } else {
    el.innerHTML = '';
  }
}

function render() {
  const c = document.getElementById('content');
  switch (S.page) {
    case 'dashboard':   c.innerHTML = renderDashboard(); break;
    case 'projects':    c.innerHTML = S.selectedProject ? renderProjectDetail() : renderProjects(); break;
    case 'briefs':      c.innerHTML = renderBriefs(); break;
    case 'communities': c.innerHTML = renderCommunities(); break;
    case 'brands':      c.innerHTML = renderBrands(); break;
  }
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const activeProjects = S.projects.filter(p => p.status === 'active');
  const openBriefs = S.briefs.filter(b => b.status === 'open');
  const byStatus = {};
  S.projects.forEach(p => { const s = p.status || 'scoping'; byStatus[s] = (byStatus[s]||0)+1; });

  const recentProjects = S.projects.slice(0, 6);

  return `
    <div style="max-width:1100px">
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat-card">
          <div class="stat-label">Communities</div>
          <div class="stat-value">${S.communities.length}</div>
          <div class="stat-sub">${S.communities.filter(c=>getTier(c)==='fully-verified').length} fully verified</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Brands</div>
          <div class="stat-value">${S.brands.length}</div>
          <div class="stat-sub">${S.briefs.length} briefs total</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Projects</div>
          <div class="stat-value" style="color:var(--lime)">${activeProjects.length}</div>
          <div class="stat-sub">${S.projects.length} total</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Open Briefs</div>
          <div class="stat-value">${openBriefs.length}</div>
          <div class="stat-sub">${S.brands.length} brands</div>

// ── PROJECT DETAIL ────────────────────────────────────────────────────────────
function renderProjectDetail() {
  const p = S.projects.find(x => x.id === S.selectedProject);
  if (!p) return `<div class="empty">Project not found. <button class="btn btn-ghost btn-sm" onclick="navigate('projects')">← Back</button></div>`;

  const tabs = ['overview','media','measurement','recap','team'];
  const tabLabels = { overview:'Overview', media:'Media Library', measurement:'Measurement', recap:'Recap Report', team:'Team' };

  return `
    <div style="max-width:1000px">
      <!-- Header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px">
        <div>
          <button class="btn btn-ghost btn-sm" onclick="navigate('projects')" style="margin-bottom:12px">← Back to Projects</button>
          <div class="bb" style="font-size:32px;line-height:1">${p.community_name||'Project'}</div>
          <div style="color:var(--muted);margin-top:4px">${p.brand_name||''} ${p.brief_title?'· '+p.brief_title:''}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:32px">
          ${statusBadge(p.status)}
        </div>
      </div>

      <!-- Status pipeline -->
      <div class="panel" style="margin-bottom:20px">
        <div class="section-label">Update Status</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${['scoping','contracted','active','wrapup','complete'].map(s => `
            <button
              class="btn btn-sm${(p.status||'scoping')===s?' btn-primary':' btn-ghost'}"
              style="${(p.status||'scoping')===s?'':'opacity:0.6'}"
              onclick="updateProjectStatus('${p.id}','${s}')">
              ${STATUS_LABELS[s]}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Tabs -->
      <div class="tab-bar">
        ${tabs.map(t => `<button class="tab-btn${S.projectTab===t?' active':''}" onclick="switchProjectTab('${t}')">${tabLabels[t]}</button>`).join('')}
      </div>

      <!-- Tab content -->

        ${renderProjectTab(p)}
      </div>

function renderProjectTab(p) {
  switch (S.projectTab) {
    case 'overview':    return renderProjectOverview(p);
    case 'media':       return renderProjectMedia(p);
    case 'measurement': return renderProjectMeasurement(p);
    case 'recap':       return renderProjectRecap(p);
    case 'team':        return renderProjectTeam(p);
    default: return '';
  }
}

function switchProjectTab(tab) {
  S.projectTab = tab;
  const p = S.projects.find(x => x.id === S.selectedProject);
  if (p) document.getElementById('project-tab-content').innerHTML = renderProjectTab(p);
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase().replace(/ /g,'') === tab.replace(/ /g,'') ||
      btn.onclick?.toString().includes(`'${tab}'`));
  });
  // Simpler: re-render the tab bar
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const tabMap = ['overview','media','measurement','recap','team'];
    btn.classList.toggle('active', tabMap[i] === tab);
  });
}

// ── PROJECT ACTIONS ───────────────────────────────────────────────────────────
async function updateProjectStatus(id, status) {
  const res = await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ status }) });
  if (res.ok) {
    const p = S.projects.find(x => x.id === id);
    if (p) p.status = status;
    render();
  }
}

async function saveProjectNotes(id) {
  const notes = document.getElementById('proj-notes').value;
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ notes }) });
  const p = S.projects.find(x => x.id === id);
  if (p) p.notes = notes;
  showToast('Notes saved');
}

async function addMilestone(id) {
  const text = document.getElementById('milestone-text').value.trim();
  const date = document.getElementById('milestone-date').value;
  if (!text) return;
  const p = S.projects.find(x => x.id === id);
  const milestones = [...(p.milestones||[]), { text, date: date||null, done: false }];
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ milestones }) });
  p.milestones = milestones;
  document.getElementById('milestones-list').innerHTML = renderMilestones(milestones);
  document.getElementById('milestone-text').value = '';
  document.getElementById('milestone-date').value = '';
}

async function toggleMilestone(id, idx, done) {
  const p = S.projects.find(x => x.id === id);
  const milestones = [...(p.milestones||[])];
  milestones[idx] = { ...milestones[idx], done };
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ milestones }) });
  p.milestones = milestones;
}

async function uploadMediaFile(id, input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const res = await apiUpload(`/api/admin/projects/${id}/media`, fd);
  if (res.ok) {
    await refreshProject(id);
    switchProjectTab('media');
  } else {
    alert('Upload failed: ' + (res.error||'Unknown error'));
  }
}

async function addVideoUrl(id) {
  const url = prompt('Enter video URL (YouTube, Vimeo, etc.):');
  if (!url) return;
  const caption = prompt('Caption (optional):') || '';
  const p = S.projects.find(x => x.id === id);
  const items = [...(p.media_items||[]), {
    id: Math.random().toString(36).slice(2,10), type:'video', url, caption,
    uploaded_at: new Date().toISOString()
  }];
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ media_items: items }) });
  p.media_items = items;
  switchProjectTab('media');
}

async function deleteMediaItem(id, itemId) {
  if (!confirm('Remove this item?')) return;
  const p = S.projects.find(x => x.id === id);
  const items = (p.media_items||[]).filter(m => m.id !== itemId);
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ media_items: items }) });
  p.media_items = items;
  switchProjectTab('media');
}

function updateEMV() {
  const imp = parseInt(document.getElementById('rpt-impressions')?.value||0);
  const cpm = parseInt(document.getElementById('rpt-cpm')?.value||25);
  const emv = imp && cpm ? Math.round(imp * cpm / 1000) : 0;
  const el = document.getElementById('emv-display');
  if (el) el.textContent = emv ? '$'+emv.toLocaleString() : '—';
}

async function saveMeasurementReport(id, status) {
  const attendance = parseInt(document.getElementById('rpt-attendance').value||0);
  const post_count = parseInt(document.getElementById('rpt-posts').value||0);
  const impressions = parseInt(document.getElementById('rpt-impressions').value||0);
  const cpm_benchmark = parseInt(document.getElementById('rpt-cpm').value||25);
  const engagement_summary = document.getElementById('rpt-summary').value;
  const methodology = document.getElementById('rpt-methodology').value;
  const hashtag = document.getElementById('rpt-hashtag').value;
  const emv = impressions && cpm_benchmark ? Math.round(impressions * cpm_benchmark / 1000) : 0;
  const report = { attendance, post_count, impressions, cpm_benchmark, emv, engagement_summary, methodology, hashtag, status };
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ report }) });

async function saveRecapReport(id, status) {
  const title = document.getElementById('recap-title').value;
  const summary = document.getElementById('recap-summary').value;
  const key_wins = document.getElementById('recap-wins').value;
  const hashtag = document.getElementById('recap-hashtag').value;
  const quotes = [0,1,2].map(i => ({
    text: document.getElementById(`recap-quote-${i}`)?.value||'',
    author: document.getElementById(`recap-author-${i}`)?.value||''
  })).filter(q => q.text);
  const recap = { title, summary, key_wins, hashtag, quotes, status };
  await api(`/api/admin/projects/${id}`, { method:'PUT', body: JSON.stringify({ recap }) });
  const p = S.projects.find(x => x.id === id);
  if (p) p.recap = recap;
  showToast(status === 'published' ? 'Case study published' : 'Draft saved');
  render();
}

async function addTeamMember(id) {

async function removeTeamMember(id, idx) {

  p.team = team;
  switchProjectTab('team');
}

    <div style="height:60px"></div>
  `;
  document.getElementById('comm-modal').style.display = 'block';
  document.getElementById('comm-modal').scrollTop = 0;
}

function closeCommunityModal() {
  document.getElementById('comm-modal').style.display = 'none';
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--lime);color:#000;font-family:\'Barlow Condensed\';font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:10px 18px;border-radius:6px;z-index:999;transition:opacity 0.3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async () => {
  document.getElementById('nav-dashboard').classList.add('active');
  await loadAll();
  render();
})();
</script>
