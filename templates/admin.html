<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayo Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --lime:#d2ff01;--cyan:#b1ecf0;--pink:#ff6ef2;--orange:#ffab40;
  --yellow:#ffea12;--green:#b3ff9e;--red:#ff6b6b;
  --muted:#666;--surface:#080808;--surface2:#111;--surface3:#1a1a1a;
  --border:#222;--border2:#2a2a2a;--white:#f0f0f0;--nav-w:216px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--surface);color:var(--white);font-family:'Barlow',sans-serif;font-size:14px;min-height:100vh;}
.bb{font-family:'Bebas Neue',sans-serif;letter-spacing:0.03em;}
.bc{font-family:'Barlow Condensed',sans-serif;}
::-webkit-scrollbar{width:4px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

.admin-app{display:flex;min-height:100vh;}

/* SIDENAV */
.sidenav{width:var(--nav-w);min-width:var(--nav-w);background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;position:sticky;top:0;flex-shrink:0;}
.sidenav-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.logo-text{font-family:'Bebas Neue';font-size:28px;letter-spacing:0.05em;}
.logo-dot{color:var(--lime);}
.role-badge{font-family:'Barlow Condensed';font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;}
.sidenav-user{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.user-name{font-weight:600;font-size:13px;}
.user-org{font-size:11px;color:var(--muted);}
.nav-section{padding:10px 10px 4px;}
.nav-section-label{font-family:'Barlow Condensed';font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all 0.12s;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface3);color:var(--white);}
.nav-item.active{background:var(--surface3);color:var(--white);}
.nav-item.active .nav-icon{color:var(--lime);}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--lime);color:#000;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;font-family:'Barlow Condensed';}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{padding:0 28px;height:56px;min-height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2);}
.topbar-title{font-family:'Barlow Condensed';font-size:18px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
.topbar-title .breadcrumb{color:var(--muted);font-weight:400;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.page{flex:1;overflow-y:auto;padding:24px 28px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.12s;text-decoration:none;}
.btn-primary{background:var(--lime);color:#000;}
.btn-primary:hover{background:#bde500;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--white);}
.btn-ghost:hover{background:var(--surface3);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.btn-danger:hover{background:rgba(255,107,107,0.1);}
.btn-cyan{background:var(--cyan);color:#000;}

/* CARDS */
.stats-row{display:grid;gap:16px;margin-bottom:24px;}
.stat-card{background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.stat-label{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.stat-value{font-family:'Bebas Neue';font-size:36px;line-height:1;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.panel{background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:20px;}
.card{background:var(--surface3);border:1px solid var(--border);border-radius:10px;overflow:hidden;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
thead th{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
tbody tr:hover{background:var(--surface3);}
tbody td{padding:12px 14px;vertical-align:middle;font-size:13px;}
tbody tr:last-child{border-bottom:none;}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:3px;font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.badge-lime{background:var(--lime);color:#000;}
.badge-cyan{background:var(--cyan);color:#000;}
.badge-green{background:var(--green);color:#000;}
.badge-orange{background:var(--orange);color:#000;}
.badge-muted{background:var(--surface3);color:var(--muted);border:1px solid var(--border2);}
.badge-red{background:rgba(255,107,107,0.15);color:var(--red);border:1px solid rgba(255,107,107,0.3);}
.status-scoping{background:var(--surface3);color:var(--muted);border:1px solid var(--border2);}
.status-contracted{background:rgba(177,236,240,0.15);color:var(--cyan);border:1px solid rgba(177,236,240,0.3);}
.status-active{background:rgba(210,255,1,0.15);color:var(--lime);border:1px solid rgba(210,255,1,0.3);}
.status-wrapup{background:rgba(255,171,64,0.15);color:var(--orange);border:1px solid rgba(255,171,64,0.3);}
.status-complete{background:rgba(179,255,158,0.15);color:var(--green);border:1px solid rgba(179,255,158,0.3);}

/* TABS */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 16px 10px 0;cursor:pointer;margin-right:4px;transition:color 0.12s;}
.tab-btn:hover{color:var(--white);}
.tab-btn.active{border-bottom-color:var(--lime);color:var(--white);}

/* FORMS */
.form-grid{display:grid;gap:16px;}
.form-grid-2{grid-template-columns:1fr 1fr;}
.form-grid-3{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.form-input,.form-select,.form-textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:9px 12px;color:var(--white);font-family:'Barlow';font-size:13px;outline:none;transition:border-color 0.15s;width:100%;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--lime);}
.form-select option{background:var(--surface2);}
.form-textarea{resize:vertical;min-height:80px;}

/* MISC */
.section-label{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.loading{text-align:center;padding:60px;color:var(--muted);font-family:'Barlow Condensed';font-size:16px;letter-spacing:0.06em;text-transform:uppercase;}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-family:'Barlow Condensed';font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--border2);color:var(--muted);}
.metric{font-family:'Barlow Condensed';font-size:16px;font-weight:700;}
.metric-label{font-size:10px;color:var(--muted);font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:0.05em;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-key{font-family:'Barlow Condensed';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
.detail-val{font-size:13px;text-align:right;}

/* SLIDE PANEL */
#slide-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--surface2);border-left:1px solid var(--border);z-index:200;overflow-y:auto;padding:28px;transform:translateX(100%);transition:transform 0.2s ease;}
#slide-panel.open{transform:translateX(0);}
#panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199;display:none;}

/* PIPELINE */
.pipeline-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pipeline-pill{padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Barlow Condensed';font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--border2);background:transparent;color:var(--muted);transition:all 0.12s;}
.pipeline-pill:hover{color:var(--white);}
.pipeline-pill.active{background:var(--surface3);color:var(--white);border-color:var(--lime);}

/* PROGRESS */
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--lime);border-radius:2px;transition:width 0.3s;}

/* MEDIA */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px;}
.media-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative;}
.media-item img{width:100%;height:100px;object-fit:cover;display:block;}
.media-item-cap{padding:6px 8px;font-size:11px;color:var(--muted);}
.media-item-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);border:none;color:var(--red);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11px;}

/* IG POST GRID */
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;}
.ig-post{border-radius:6px;overflow:hidden;background:var(--surface3);position:relative;aspect-ratio:1;}
.ig-post img{width:100%;height:100%;object-fit:cover;display:block;}
.ig-post-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);}
.ig-post:hover .ig-post-overlay{opacity:1;}
.ig-post-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.65);opacity:0;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Barlow Condensed';font-size:12px;font-weight:700;}

/* QUOTE SLOTS */
.quote-slot{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:12px;}

/* MEMBER CARDS */
.member-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}

/* COVER PREVIEW */
.cover-preview{width:100%;height:120px;border-radius:8px;display:flex;align-items:flex-end;padding:16px;margin-bottom:12px;position:relative;}
</style>
</head>
<body>

<div class="admin-app">
  <nav class="sidenav">
    <div class="sidenav-logo">
      <div class="logo-text">mayo<span class="logo-dot">.</span></div>
      <span class="role-badge" style="background:var(--orange);color:#000">Admin</span>
    </div>
    <div class="sidenav-user">
      <div class="avatar" style="background:var(--lime);color:#000">A</div>
      <div><div class="user-name">Admin Panel</div><div class="user-org">mayo.fyi</div></div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Overview</div>
      <button class="nav-item" id="nav-dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">⊞</span> Dashboard
      </button>
      <button class="nav-item" id="nav-projects" onclick="navigate('projects')">
        <span class="nav-icon">◈</span> Projects
        <span class="nav-badge" id="badge-projects" style="display:none">0</span>
      </button>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Management</div>
      <button class="nav-item" id="nav-briefs" onclick="navigate('briefs')">
        <span class="nav-icon">◻</span> Briefs
      </button>
      <button class="nav-item" id="nav-communities" onclick="navigate('communities')">
        <span class="nav-icon">◉</span> Communities
      </button>
      <button class="nav-item" id="nav-brands" onclick="navigate('brands')">
        <span class="nav-icon">◈</span> Brands
      </button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="page" id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="panel-overlay" onclick="closePanel()"></div>
<div id="slide-panel"></div>

<div id="admin-token" style="display:none">{{ admin_token }}</div>

<script>
const ADMIN_TOKEN = document.getElementById('admin-token').textContent.trim();

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  page:'dashboard', projectFilter:'all', projectTab:'overview',
  selectedProject:null, selectedCommunity:null, communityTab:'overview',
  selectedBrand:null, selectedBrief:null,
  communities:[], brands:[], briefs:[], projects:[],
};

// ── API ──────────────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const sep = path.includes('?')?'&':'?';
  const url = /^\/api\/community|^\/api\/brand/.test(path) ? path : `${path}${sep}token=${ADMIN_TOKEN}`;
  const res = await fetch(url, {
    headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN,...(opts.headers||{})},
    ...opts
  });
  return res.json();
}
async function apiForm(path, fd) {
  const sep = path.includes('?')?'&':'?';
  const res = await fetch(`${path}${sep}token=${ADMIN_TOKEN}`, {
    method:'POST', headers:{'X-Admin-Token':ADMIN_TOKEN}, body:fd
  });
  return res.json();
}

async function loadAll() {
  const [comm,brands,briefs,projects] = await Promise.all([
    api('/api/admin/communities'), api('/api/admin/brands'),
    api('/api/admin/briefs'), api('/api/admin/projects'),
  ]);
  S.communities = Array.isArray(comm)?comm:[];
  S.brands = Array.isArray(brands)?brands:[];
  S.briefs = Array.isArray(briefs)?briefs:[];
  S.projects = Array.isArray(projects)?projects:[];
  const active = S.projects.filter(p=>p.status==='active').length;
  const el = document.getElementById('badge-projects');
  if(el){el.textContent=active;el.style.display=active?'':'none';}
}

// ── Helpers ──────────────────────────────────────────────────────────────────
const COVER_OPTIONS = [
  {id:1,gradient:'linear-gradient(135deg,#1a1a2e 0%,#0f3460 70%,#533483 100%)'},
  {id:2,gradient:'linear-gradient(135deg,#0d0d0d 0%,#3d1c00 70%,#c43a00 100%)'},
  {id:3,gradient:'linear-gradient(135deg,#0a1628 0%,#1b3a4b 50%,#2d6a4f 100%)'},
  {id:4,gradient:'linear-gradient(135deg,#1a0a00 0%,#8a6a40 70%,#c4a060 100%)'},
  {id:5,gradient:'linear-gradient(135deg,#0d0d1a 0%,#2d1b69 70%,#6b2d8b 100%)'},
  {id:6,gradient:'linear-gradient(135deg,#001a0a 0%,#006b2d 70%,#00a844 100%)'},
];
const AV_COLORS=[{bg:'#d2ff01',t:'#000'},{bg:'#b1ecf0',t:'#000'},{bg:'#ff6ef2',t:'#000'},{bg:'#ffab40',t:'#000'},{bg:'#b3ff9e',t:'#000'},{bg:'#ff6b6b',t:'#000'},{bg:'#a78bfa',t:'#000'},{bg:'#34d399',t:'#000'}];
function avCol(name){let h=0;for(let i=0;i<(name||'').length;i++)h=(h*31+(name||'').charCodeAt(i))&0xffff;return AV_COLORS[h%AV_COLORS.length];}
function fDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fCur(n){if(!n)return'—';return'$'+Number(n).toLocaleString();}
function getER(c){const m=c.instagram_data?.media||[];const f=c.instagram_data?.profile?.followers_count||0;if(!m.length||!f)return null;const t=m.reduce((s,p)=>s+(p.like_count||0)+(p.comments_count||0),0);return Math.round(t/m.length/f*10000)/100;}
function getFollowers(c){return c.instagram_data?.profile?.followers_count??null;}
function getTier(c){const n=[!!c.instagram_token,!!c.substack_url].filter(Boolean).length;if(n>=2)return'fully-verified';if(n>=1)return'verified';return'starter';}
function tierBadge(tier){if(tier==='fully-verified')return'<span class="badge badge-lime">✦ Fully Verified</span>';if(tier==='verified')return'<span class="badge badge-cyan">✦ Verified</span>';return'<span class="badge badge-muted">Starter</span>';}
const STATUS_LABELS={scoping:'Scoping',contracted:'Contracted',active:'Active',wrapup:'Wrap-up',complete:'Complete'};
function statusBadge(s){return`<span class="badge status-${s||'scoping'}">${STATUS_LABELS[s]||s||'—'}</span>`;}
const ARCH_COLORS={evangelists:'var(--pink)',early_adopters:'var(--cyan)',loyalists:'var(--lime)',buyers:'var(--orange)'};
const ARCH_LABELS={evangelists:'Evangelists',early_adopters:'Early Adopters',loyalists:'Loyalists',buyers:'Buyers'};

// ── Navigation ───────────────────────────────────────────────────────────────
const PAGE_NAV = {
  dashboard:'dashboard',projects:'projects','project-detail':'projects',
  briefs:'briefs','brief-detail':'briefs',
  communities:'communities','community-detail':'communities',
  brands:'brands','brand-detail':'brands',
};
function navigate(page, extra={}) {
  S.page=page; Object.assign(S,extra);
  ['dashboard','projects','briefs','communities','brands'].forEach(p=>{
    const el=document.getElementById(`nav-${p}`);
    if(el)el.classList.toggle('active',(PAGE_NAV[page]||page)===p);
  });
  renderTopbar(); render();
}

function renderTopbar() {
  const titles={dashboard:'Dashboard',projects:'Projects',briefs:'Briefs',communities:'Communities',brands:'Brands'};
  let title = titles[S.page]||S.page;
  if(S.page==='community-detail'){const c=S.communities.find(x=>x.id===S.selectedCommunity);title=`<span class="breadcrumb">Communities /</span> ${c?c.name:''}`;}
  else if(S.page==='brand-detail'){const b=S.brands.find(x=>x.id===S.selectedBrand);title=`<span class="breadcrumb">Brands /</span> ${b?b.name:''}`;}
  else if(S.page==='brief-detail'){const br=S.briefs.find(x=>x.id===S.selectedBrief);title=`<span class="breadcrumb">Briefs /</span> ${br?br.title:''}`;}
  else if(S.page==='project-detail'){const p=S.projects.find(x=>x.id===S.selectedProject);title=`<span class="breadcrumb">Projects /</span> ${p?p.community_name||p.title||'Project':''}`;}
  document.getElementById('topbar-title').innerHTML=title;
  const acts=document.getElementById('topbar-actions');
  if(S.page==='projects')acts.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openCreateProject()">+ New Project</button>`;
  else if(S.page==='briefs')acts.innerHTML=`<button class="btn btn-primary btn-sm" onclick="openCreateBrief()">+ New Brief</button>`;
  else if(S.page==='community-detail'){const c=S.communities.find(x=>x.id===S.selectedCommunity);acts.innerHTML=`<a href="/profile/${S.selectedCommunity}" target="_blank" class="btn btn-ghost btn-sm">↗ Public Profile</a>${c&&c.instagram_token?`<button class="btn btn-ghost btn-sm" onclick="refreshIG('${S.selectedCommunity}')">Refresh IG</button>`:''}`;}
  else acts.innerHTML='';
}

function render() {
  const c=document.getElementById('content');
  switch(S.page){
    case'dashboard':c.innerHTML=renderDashboard();break;
    case'projects':c.innerHTML=renderProjects();break;
    case'project-detail':c.innerHTML=renderProjectDetail();break;
    case'briefs':c.innerHTML=renderBriefs();break;
    case'brief-detail':c.innerHTML=renderBriefDetail();break;
    case'communities':c.innerHTML=renderCommunities();break;
    case'community-detail':c.innerHTML=renderCommunityDetail();break;
    case'brands':c.innerHTML=renderBrands();break;
    case'brand-detail':c.innerHTML=renderBrandDetail();break;
  }
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard(){
  const byStatus={};S.projects.forEach(p=>{const s=p.status||'scoping';byStatus[s]=(byStatus[s]||0)+1;});
  const recent=S.projects.slice(0,6);
  return`<div style="max-width:1100px">
    <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-label">Communities</div><div class="stat-value">${S.communities.length}</div><div class="stat-sub">${S.communities.filter(c=>getTier(c)==='fully-verified').length} fully verified</div></div>

// ── PROJECT TIMELINE ──────────────────────────────────────────────────────────
const STAGE_NAMES=['Briefing','Discovery','Proposals','Contracting','Activation Prep','Activation','Reporting'];
const STAGE_COLORS={'Briefing':'var(--cyan)','Discovery':'#a78bfa','Proposals':'var(--yellow)','Contracting':'var(--lime)','Activation Prep':'var(--orange)','Activation':'var(--pink)','Reporting':'var(--green)'};
const TL_ST={not_started:{label:'Not Started',badge:'badge-muted'},in_progress:{label:'In Progress',badge:'badge-cyan'},complete:{label:'Complete',badge:'badge-lime'},delayed:{label:'Delayed',badge:'badge-red'}};

function renderProjTimeline(p){
  const tl=p.timeline||{};
  const stages=tl.stages||[];
  const today=new Date();

  let minD,maxD;
  if(stages.length&&stages.some(s=>s.start_date)){
    const starts=stages.filter(s=>s.start_date).map(s=>new Date(s.start_date));
    const ends=stages.filter(s=>s.end_date).map(s=>new Date(s.end_date));
    minD=new Date(Math.min(...starts));maxD=new Date(Math.max(...ends));
  }else if(p.start_date&&p.end_date){
    minD=new Date(p.start_date);maxD=new Date(p.end_date);
  }else{
    minD=new Date(today);maxD=new Date(today.getTime()+90*86400000);
  }
  minD=new Date(minD.getTime()-7*86400000);
  maxD=new Date(maxD.getTime()+14*86400000);
  const totalMs=maxD-minD;

  function pct(d){return Math.max(0,Math.min(100,(new Date(d)-minD)/totalMs*100)).toFixed(2);}
  function wPct(s,e){return Math.max(1.5,(new Date(e)-new Date(s))/totalMs*100).toFixed(2);}

  const months=[];
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  while(cur<=maxD){
    const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const left=Math.max(0,(cur-minD)/totalMs*100);
    const right=Math.min(100,(next-minD)/totalMs*100);
    months.push({label:cur.toLocaleDateString('en-US',{month:'short',year:'2-digit'}),left:left.toFixed(2),width:(right-left).toFixed(2)});
    cur=next;
  }

  const todayPct=pct(today);
  const hasDelayed=stages.some(s=>s.status==='delayed'||(s.end_date&&new Date(s.end_date)<today&&s.status!=='complete'));
  const ganttH=Math.max(60,stages.length*38+8);

  const gantt=`
    <div style="position:relative;overflow-x:auto">
      <div style="position:relative;height:30px;border-bottom:1px solid var(--border2)">
        ${months.map(m=>`<div style="position:absolute;left:${m.left}%;width:${m.width}%;border-left:1px solid var(--border2);padding:0 8px;font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);height:30px;display:flex;align-items:center;overflow:hidden">${m.label}</div>`).join('')}
      </div>
      <div style="position:relative;height:${ganttH}px">
        ${months.map(m=>`<div style="position:absolute;top:0;bottom:0;left:${m.left}%;width:1px;background:var(--border)"></div>`).join('')}
        <div style="position:absolute;top:0;bottom:0;left:${todayPct}%;width:1px;background:rgba(210,255,1,0.4);z-index:2"></div>
        ${stages.map((s,i)=>{
          if(!s.start_date||!s.end_date)return'';
          const col=STAGE_COLORS[s.name]||'var(--muted)';
          return`<div style="position:absolute;top:${i*38+7}px;height:24px;left:${pct(s.start_date)}%;width:${wPct(s.start_date,s.end_date)}%;background:${col};border-radius:12px;display:flex;align-items:center;padding:0 10px;z-index:1;min-width:60px" title="${esc(s.name)}: ${s.start_date} → ${s.end_date}">
            <span style="font-family:'Barlow Condensed';font-size:11px;font-weight:700;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  const tracker=stages.length?`<div>${stages.map((s,i)=>{
    const st=TL_ST[s.status||'not_started']||TL_ST.not_started;
    const col=STAGE_COLORS[s.name]||'var(--muted)';
    return`<div style="border-bottom:1px solid var(--border);padding:10px 0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <div style="font-weight:600;font-size:13px;flex:1">${esc(s.name)}</div>

async function addStage(id){
  const name=document.getElementById('tl-name').value;if(!name)return;
  const p=S.projects.find(x=>x.id===id);
  const stages=[...(p.timeline?.stages||[]),{id:Math.random().toString(36).slice(2,10),name,status:document.getElementById('tl-status').value,start_date:document.getElementById('tl-start').value||null,end_date:document.getElementById('tl-end').value||null,updates:''}];
  const timeline={...(p.timeline||{}),stages};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({timeline})});
  p.timeline=timeline;switchProjTab('timeline');
}

async function updateStageStatus(id,idx,status){
  const p=S.projects.find(x=>x.id===id);
  const stages=[...(p.timeline?.stages||[])];stages[idx]={...stages[idx],status};
  const timeline={...(p.timeline||{}),stages};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({timeline})});
  p.timeline=timeline;switchProjTab('timeline');
}

async function saveStageUpdate(id,idx){
  const val=document.getElementById(`stage-upd-${idx}`)?.value||'';
  const p=S.projects.find(x=>x.id===id);
  const stages=[...(p.timeline?.stages||[])];stages[idx]={...stages[idx],updates:val};
  const timeline={...(p.timeline||{}),stages};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({timeline})});
  p.timeline=timeline;showToast('Updates saved');
}

async function removeStage(id,idx){
  if(!confirm('Remove this stage?'))return;
  const p=S.projects.find(x=>x.id===id);
  const stages=(p.timeline?.stages||[]).filter((_,i)=>i!==idx);
  const timeline={...(p.timeline||{}),stages};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({timeline})});
  p.timeline=timeline;switchProjTab('timeline');
}

async function saveProposal(id){
  const proposal={submitted_by:document.getElementById('pr-by').value,date:document.getElementById('pr-date').value||null,budget_requested:document.getElementById('pr-budget').value,status:document.getElementById('pr-status').value,pitch:document.getElementById('pr-pitch').value,deliverables:document.getElementById('pr-del').value,attachment_url:document.getElementById('pr-url').value,notes:document.getElementById('pr-notes').value};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({proposal})});
  const p=S.projects.find(x=>x.id===id);if(p)p.proposal=proposal;showToast('Proposal saved');
}

async function acceptProposal(id){
  document.getElementById('pr-status').value='accepted';
  await saveProposal(id);
  const p=S.projects.find(x=>x.id===id);if(p&&p.proposal)p.proposal.status='accepted';
  switchProjTab('proposal');
}

// ── COMMUNITY ACTIONS ─────────────────────────────────────────────────────────
function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

async function saveCommunityEdit(id){
  const tags=document.getElementById('ce-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const data={
    name:document.getElementById('ce-name').value,tagline:document.getElementById('ce-tagline').value,
    location:document.getElementById('ce-location').value,leader_name:document.getElementById('ce-leader').value,
    email:document.getElementById('ce-email').value,website:document.getElementById('ce-website').value,
    active_members:parseInt(document.getElementById('ce-members').value)||null,
    substack_url:document.getElementById('ce-substack').value,
    description:document.getElementById('ce-desc').value,tags,
    partnership_preferences:document.getElementById('ce-prefs').value,
  };
  const res=await api(`/api/community/${id}`,{method:'PUT',body:JSON.stringify(data)});
  if(res.ok){
    const i=S.communities.findIndex(x=>x.id===id);
    if(i>=0)Object.assign(S.communities[i],data);
    showToast('Saved');
    S.communityTab='overview';render();
  }else{const el=document.getElementById('ce-err');if(el){el.textContent=res.error||'Failed';el.style.display='';}}
}

async function stampCIS(id){
  const val=parseInt(document.getElementById('cis-val').value);
  if(isNaN(val))return;
  const res=await api(`/api/community/${id}/apply-cis-stamp`,{method:'POST',body:JSON.stringify({stamped_score:val,stamped_by:'admin'})});
  if(res.ok){const i=S.communities.findIndex(x=>x.id===id);if(i>=0)S.communities[i].cis_stamped=val;showToast('Stamped');render();}
  else showToast('Error: '+(res.error||'Failed'));
}
async function clearCIStamp(id){
  const res=await api(`/api/community/${id}/apply-cis-stamp`,{method:'POST',body:JSON.stringify({stamped_score:null})});
  if(res.ok){const i=S.communities.findIndex(x=>x.id===id);if(i>=0)S.communities[i].cis_stamped=null;showToast('Stamp cleared');render();}
}
async function recalculate(id){
  document.getElementById('recalc-out').textContent='Calculating…';
  const res=await api(`/api/community/${id}/recalculate`,{method:'POST'});
  if(res.network_multiplier!=null||res.cis_raw!=null){
    const i=S.communities.findIndex(x=>x.id===id);
    if(i>=0){S.communities[i].network_multiplier=res.network_multiplier;S.communities[i].cis_raw=res.cis_raw;}
    document.getElementById('recalc-out').textContent=`NM: ${res.network_multiplier!=null?res.network_multiplier.toFixed(2):'—'} · CIS Raw: ${res.cis_raw!=null?res.cis_raw:'—'}`;
  }else document.getElementById('recalc-out').textContent='Error: '+(res.error||'Failed');
}
async function suggestArchetype(id){
  const out=document.getElementById('arch-out');out.textContent='Analysing with AI…';
  const res=await api(`/api/community/${id}/suggest-archetype`,{method:'POST'});
  if(res.archetype){
    out.innerHTML=`Suggested: <strong style="color:${ARCH_COLORS[res.archetype]||'var(--white)'}">${ARCH_LABELS[res.archetype]}</strong> (${res.confidence}% confidence)<br><span style="color:rgba(240,240,240,0.6)">${res.reasoning||''}</span>`;
    out.innerHTML+=`<br><button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="applyArchetype('${id}','${res.archetype}','ai','${esc(res.reasoning||'')}',${res.confidence||0})">Apply This</button>`;
  }else out.textContent='Error: '+(res.error||'Failed');
}
async function applyArchetype(id,arch,src,reasoning,confidence){
  const res=await api(`/api/community/${id}`,{method:'PUT',body:JSON.stringify({archetype:arch,archetype_source:src,archetype_reasoning:reasoning,archetype_confidence:confidence})});
  if(res.ok){const i=S.communities.findIndex(x=>x.id===id);if(i>=0){S.communities[i].archetype=arch;S.communities[i].archetype_source=src;S.communities[i].archetype_reasoning=reasoning;S.communities[i].archetype_confidence=confidence;}showToast('Archetype applied');render();}
}
async function overrideArchetype(id){
  const arch=document.getElementById('arch-override').value;
  if(!arch)return;
  await applyArchetype(id,arch,'manual','',null);
}
async function analyseMIQ(id){
  const out=document.getElementById('miq-out');out.textContent='Analysing…';
  const res=await api(`/api/community/${id}/analyse-miq`,{method:'POST'});
  if(res.miq_score!=null){
    const i=S.communities.findIndex(x=>x.id===id);if(i>=0){S.communities[i].miq_score=res.miq_score;S.communities[i].miq_reasoning=res.reasoning;}
    out.textContent=`MIQ: ${res.miq_score} — ${res.reasoning||''}`;
    setTimeout(()=>render(),1500);
  }else out.textContent='Error: '+(res.error||'Failed');
}

async function updateProjectStatus(id,status){

async function saveProjNotes(id){

async function addMilestone(id){
  const text=document.getElementById('ms-text').value.trim();const date=document.getElementById('ms-date').value;
  if(!text)return;
  const p=S.projects.find(x=>x.id===id);
  const milestones=[...(p.milestones||[]),{text,date:date||null,done:false}];
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({milestones})});
  p.milestones=milestones;document.getElementById('milestones-list').innerHTML=renderMilestones(milestones,id);

async function toggleMS(id,idx,done){
  const p=S.projects.find(x=>x.id===id);const ms=[...(p.milestones||[])];ms[idx]={...ms[idx],done};
  await api(`/api/admin/projects/${id}`,{method:'PUT',body:JSON.stringify({milestones:ms})});p.milestones=ms;

async function uploadProjMedia(id,input){
  const file=input.files[0];if(!file)return;

  const res=await apiForm(`/api/admin/projects/${id}/media`,fd);

  else alert('Upload failed: '+(res.error||'Unknown'));
}
async function addVideoLink(id){

  p.media_items=items;switchProjTab('media');
}
async function delMediaItem(id,itemId){
  if(!confirm('Remove?'))return;
  const p=S.projects.find(x=>x.id===id);
  const items=(p.media_items||[]).filter(m=>m.id!==itemId);

function openPanel(html){document.getElementById('slide-panel').innerHTML=html;document.getElementById('slide-panel').classList.add('open');document.getElementById('panel-overlay').style.display='block';}
function closePanel(){document.getElementById('slide-panel').classList.remove('open');document.getElementById('panel-overlay').style.display='none';}

function openCreateBrief(){
  openPanel(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><div class="bb" style="font-size:24px">New Brief</div><button class="btn btn-ghost btn-sm" onclick="closePanel()">✕</button></div>
    <div class="form-grid" style="gap:14px">
      <div class="form-group"><label class="form-label">Brand *</label><select class="form-select" id="bf-brand"><option value="">Select brand…</option>${S.brands.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="bf-title" placeholder="Brief title"></div>
      <div class="form-group"><label class="form-label">Campaign Goal</label><input class="form-input" id="bf-goal"></div>
      <div class="form-group"><label class="form-label">Partnership Type</label><select class="form-select" id="bf-type"><option value="">Select…</option><option>Event Sponsorship</option><option>Content Partnership</option><option>Product Seeding</option><option>Ambassador Programme</option><option>Community Activation</option></select></div>
      <div class="form-group"><label class="form-label">Budget</label><select class="form-select" id="bf-budget"><option value="">Select…</option><option>Under $5K</option><option>$5K–$15K</option><option>$15K–$50K</option><option>$50K+</option></select></div>
      <div class="form-group"><label class="form-label">Looking For</label><textarea class="form-textarea" id="bf-looking"></textarea></div>
      <div class="form-group"><label class="form-label">Tags (comma-separated)</label><input class="form-input" id="bf-tags"></div>
      <div id="bf-err" style="color:var(--red);font-size:12px;display:none"></div>
      <button class="btn btn-primary" onclick="submitBrief()">Create Brief</button>
    </div>`);
}
function openCreateBriefForBrand(brandId,brandName){
  openCreateBrief();
  setTimeout(()=>{const sel=document.getElementById('bf-brand');if(sel)sel.value=brandId;},50);
}

async function submitBrief(){
  const brand_id=document.getElementById('bf-brand').value,title=document.getElementById('bf-title').value.trim();
  const err=document.getElementById('bf-err');
  if(!brand_id||!title){err.textContent='Brand and title required.';err.style.display='';return;}
  err.style.display='none';
  const tags=document.getElementById('bf-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const res=await api('/api/admin/briefs',{method:'POST',body:JSON.stringify({brand_id,title,campaign_goal:document.getElementById('bf-goal').value,partnership_type:document.getElementById('bf-type').value,budget:document.getElementById('bf-budget').value,looking_for:document.getElementById('bf-looking').value,tags})});
  if(res.ok){const fresh=await api('/api/admin/briefs');S.briefs=Array.isArray(fresh)?fresh:S.briefs;closePanel();navigate('briefs');showToast('Brief created');}
  else{err.textContent=res.error||'Failed';err.style.display='';}
}

function openCreateProject(){
  openPanel(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><div class="bb" style="font-size:24px">New Project</div><button class="btn btn-ghost btn-sm" onclick="closePanel()">✕</button></div>
    <div class="form-grid" style="gap:14px">
      <div class="form-group"><label class="form-label">Community *</label><select class="form-select" id="pj-comm"><option value="">Select…</option>${S.communities.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Brand *</label><select class="form-select" id="pj-brand"><option value="">Select…</option>${S.brands.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Brief (optional)</label><select class="form-select" id="pj-brief"><option value="">None</option>${S.briefs.map(b=>`<option value="${b.id}">${b.title} (${b.brand_name||'?'})</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Project Title</label><input class="form-input" id="pj-title"></div>
      <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="pj-type"><option value="">Select…</option><option>Event Sponsorship</option><option>Content Partnership</option><option>Product Seeding</option><option>Ambassador Programme</option><option>Community Activation</option></select></div>

      <div class="form-grid form-grid-2"><div class="form-group"><label class="form-label">Start</label><input class="form-input" type="date" id="pj-start"></div><div class="form-group"><label class="form-label">End</label><input class="form-input" type="date" id="pj-end"></div></div>
      <div class="form-group"><label class="form-label">Initial Status</label><select class="form-select" id="pj-status"><option value="scoping">Scoping</option><option value="contracted">Contracted</option><option value="active">Active</option></select></div>
      <div id="pj-err" style="color:var(--red);font-size:12px;display:none"></div>
      <button class="btn btn-primary" onclick="submitProject()">Create Project</button>
    </div>`);
}

async function submitProject(){
  const community_id=document.getElementById('pj-comm').value,brand_id=document.getElementById('pj-brand').value;
  const err=document.getElementById('pj-err');
  if(!community_id||!brand_id){err.textContent='Community and brand required.';err.style.display='';return;}
  err.style.display='none';
  const res=await api('/api/admin/projects',{method:'POST',body:JSON.stringify({community_id,brand_id,brief_id:document.getElementById('pj-brief').value||null,title:document.getElementById('pj-title').value,type:document.getElementById('pj-type').value,budget:parseFloat(document.getElementById('pj-budget').value)||null,start_date:document.getElementById('pj-start').value||null,end_date:document.getElementById('pj-end').value||null,status:document.getElementById('pj-status').value})});
  if(res.ok){const fresh=await api('/api/admin/projects');S.projects=Array.isArray(fresh)?fresh:S.projects;closePanel();navigate('projects');showToast('Project created');}
  else{err.textContent=res.error||'Failed';err.style.display='';}
}

async function deleteBrief(id){
  if(!confirm('Delete this brief?'))return;
  await api(`/api/admin/briefs/${id}`,{method:'DELETE'});
  S.briefs=S.briefs.filter(b=>b.id!==id);render();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let _tt;
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;right:24px;background:var(--lime);color:#000;font-family:\'Barlow Condensed\';font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:10px 18px;border-radius:6px;z-index:999;transition:opacity 0.3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(()=>t.style.opacity='0',2500);
}
